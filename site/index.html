<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>증권·자산운용·은행·캐피탈·지주 보수 랭킹</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <h1>증권·자산운용·은행·캐피탈·지주 개인별 보수 랭킹</h1>
    <p class="note">
      DART 공시의 「보수 5억원 이상」 개인별 보수 기준입니다. 이사·감사와 직원 상위 5명 공시를 함께 담아
      회사에 따라 5명을 넘습니다. 전체 임직원 연봉 자료가 아닙니다.
    </p>
  </header>

  <main>
    <div class="search-row">
      <input
        type="search"
        id="searchInput"
        class="search-input"
        placeholder="이름 또는 회사명으로 검색 (예: 홍길동, 미래에셋)"
        autocomplete="off"
      />
    </div>

    <div class="controls">
      <label class="control" id="periodControl">
        <span>기간</span>
        <select id="periodSelect"></select>
      </label>
      <div class="control sector-tabs" id="sectorTabs">
        <button class="tab active" data-sector="전체">전체</button>
        <button class="tab" data-sector="증권사">증권사</button>
        <button class="tab" data-sector="자산운용사">자산운용사</button>
        <button class="tab" data-sector="은행">은행</button>
        <button class="tab" data-sector="캐피탈사">캐피탈사</button>
        <button class="tab" data-sector="금융지주">금융지주</button>
      </div>
    </div>

    <div class="summary" id="summary"></div>

    <ol class="ranking" id="ranking"></ol>
  </main>

  <footer>
    <p>자료: OpenDART(금융감독원 전자공시시스템) · 5억원 이상 공시 기준</p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
